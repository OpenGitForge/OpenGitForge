global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# ---- HTTP(S) entry -> git-http-backend via nginx in the gitserver container ----
frontend http_front
    bind *:80
    mode http
    option httplog
    default_backend git_http_back

backend git_http_back
    mode http
    server git1 gitserver:8080 check

# ---- SSH entry: raw TCP passthrough, HAProxy never touches the protocol ----
frontend ssh_front
    bind *:2222
    mode tcp
    option tcplog
    default_backend git_ssh_back

backend git_ssh_back
    mode tcp
    server git1 gitserver:22 check

# TODO(443/TLS): once certs exist, either terminate here with
#   `bind *:443 ssl crt /path/to/cert.pem` and a `mode http` frontend/backend
#   pair mirroring http_front/git_http_back, or keep 443 in `mode tcp` and
#   terminate TLS further upstream. Left out for now since no certs exist yet.
