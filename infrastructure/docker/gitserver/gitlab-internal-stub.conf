server {
    listen 127.0.0.1:3001;
    server_name _;
    default_type application/json;

    # Gitaly's pre-receive hook check. `status: true` always allows the push —
    # your ASP.NET Core API already made the real permission decision before
    # ever calling Gitaly's write RPCs, so this is a formality.
    location = /api/v4/internal/allowed {
        return 200 '{"status": true, "gl_repository": "stub", "gl_id": "stub", "gl_username": "stub", "git_config_options": [], "gl_console_messages": []}';
    }

    location = /api/v4/internal/pre_receive {
        return 200 '{"reference_counter_increased": true}';
    }

    location = /api/v4/internal/post_receive {
        return 200 '{"reference_counter_decreased": true, "messages": [], "payload": {}}';
    }

    location / {
        return 404;
    }
}
