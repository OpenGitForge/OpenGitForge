# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Passing -f explicitly means docker-compose.override.yml is NOT merged in,
# so the git container stays without published ports (internal-only, only
# reachable by other containers on the `forge` network) — no extra work
# needed here to "remove" the dev debug ports.

services:
  gitserver:
    environment:
      # `environment` is merged key-by-key across compose files, so this
      # cleanly overrides the dev default in docker-compose.yml.
      AUTH_API_URL: "http://api:5000"

  api:
    build:
      context: ./docker/api # TODO: Define API project
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # TODO: DB connection string, etc.
    networks:
      - forge
    depends_on:
      - gitserver

  proxy:
    depends_on:
      - gitserver
      - api
